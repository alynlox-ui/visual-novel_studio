<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><title>示例：午后的抉择</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;font-family:system-ui,'Microsoft YaHei',sans-serif;background:#111;color:#fff}#app{position:relative;width:100%;height:100%;background:#222;background-size:cover;background-position:center}#cast{position:absolute;inset:7% 0 0;z-index:1;display:flex;align-items:flex-end;justify-content:center;pointer-events:none}#cast img{max-height:84vh;max-width:76vw;object-fit:contain;filter:drop-shadow(0 10px 22px rgba(0,0,0,.42))}#shade{position:absolute;inset:0;background:linear-gradient(transparent 45%,rgba(0,0,0,.62))}#top{position:absolute;top:12px;left:12px;z-index:4;display:flex;gap:6px;flex-wrap:wrap}button{border:1px solid rgba(255,255,255,.35);border-radius:8px;padding:7px 12px;background:rgba(20,20,30,.7);color:#fff;cursor:pointer}button:hover{background:#fb7299}.panel{position:absolute;left:50%;bottom:5%;transform:translateX(-50%);width:min(920px,92vw);z-index:3}.speaker{display:inline-block;background:#fb7299;border-radius:999px;padding:5px 14px;margin-bottom:6px}.text{background:rgba(10,10,18,.78);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:18px 20px;min-height:110px;font-size:clamp(16px,2.2vw,22px);line-height:1.75}.choices{position:absolute;left:50%;top:35%;transform:translate(-50%,-50%);width:min(640px,88vw);display:flex;flex-direction:column;gap:10px;z-index:5}.choices button{font-size:17px;padding:13px;background:rgba(10,10,18,.82)}#title,#end{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#181421;text-align:center}#title h1,#end h1{font-size:clamp(28px,6vw,52px);margin:0;color:#ff8db0}.muted{color:#bbb;font-size:14px}.hidden{display:none!important}@keyframes cast-fade{from{opacity:0}to{opacity:1}}@keyframes cast-slide{from{opacity:0;transform:translateX(-30px)}to{opacity:1;transform:translateX(0)}}@keyframes cast-pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:scale(1)}}</style></head><body><main id="app"><div id="shade"></div><div id="cast"></div><div id="top"><button id="back">返回标题</button><button id="mute">🔊 音效</button><select id="lang" title="语言"></select></div><div id="choices" class="choices hidden"></div><section class="panel"><div id="speaker" class="speaker hidden"></div><div id="text" class="text"></div></section><section id="title"><h1 id="titleName"></h1><div class="muted">可运行导出版本</div><button id="start">开始游戏</button></section><section id="end" class="hidden"><div class="muted" id="endKind"></div><h1 id="endTitle"></h1><button id="again">重新开始</button><button id="endBack">回到标题</button></section></main><script>const PROJECT={"id":"proj_4eefg9s","title":"示例：午后的抉择","startScene":"s_start","flags":{"小夜好感":0},"scenes":[{"id":"s_start","name":"放学后","x":60,"y":220,"bg":"#ffffff","speaker":"","text":"放学的铃声响起，你收拾好书包，走出教室。黄昏的阳光把走廊染成金色。","setFlags":[],"next":"s_meet","autoBranches":[],"choices":[],"ending":null,"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_meet","name":"校门口","x":330,"y":220,"bg":"#1e1b4b","speaker":"小夜","text":"「啊，你也现在才走呀？」小夜在校门口朝你挥手。","setFlags":[],"next":"","autoBranches":[],"choices":[{"id":"c1","text":"和她一起走一段","target":"s_road","cond":"","setFlags":[{"flag":"小夜好感","op":"+","value":1}]},{"id":"c2","text":"说有事，自己回去","target":"s_alone","cond":"","setFlags":[]}],"ending":null,"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_road","name":"同行","x":600,"y":110,"bg":"#14532d","speaker":"","text":"你们并肩走在河堤上，聊着今天的课程。夕阳把影子拉得很长。","setFlags":[{"flag":"小夜好感","op":"+","value":1}],"next":"s_night","autoBranches":[],"choices":[],"ending":null,"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_alone","name":"独自归途","x":600,"y":340,"bg":"#FB7299","speaker":"","text":"你一个人踏上回家的路。偶尔，会想起小夜挥手时的笑容。","setFlags":[],"next":"s_night","autoBranches":[],"choices":[],"ending":null,"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_night","name":"夜晚","x":870,"y":220,"bg":"#ffffff","speaker":"","text":"躺在床上，你回想这一天发生的事。","setFlags":[],"next":"","autoBranches":[{"target":"s_good","cond":"小夜好感 >= 2"},{"target":"s_normal","cond":"true"}],"choices":[],"ending":null,"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_good","name":"结局：与你共度的黄昏","x":1160,"y":100,"bg":"#422006","speaker":"","text":"第二天，小夜主动来找你：「今天也一起回家吧？」你笑着点了点头。","setFlags":[],"next":"","autoBranches":[],"choices":[],"ending":{"kind":"good","title":"与你共度的黄昏"},"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]},{"id":"s_normal","name":"结局：平淡的一天","x":1160,"y":340,"bg":"#FB7299","speaker":"","text":"日子依旧平淡地流淌。也许，明天会有所不同吧。","setFlags":[],"next":"","autoBranches":[],"choices":[],"ending":{"kind":"normal","title":"平淡的一天"},"bgImage":"","dialogues":[],"video":"","videoMuted":true,"bgm":"","bgmVolume":0.6,"characters":[]}],"locales":{},"assets":[],"outline":{"logline":"","summary":"","routes":[]},"branchPlan":[],"characters":[],"ui":{"global":{"fontFamily":"system-ui","transitionMs":220,"charTransition":"fade"},"textbox":{"show":true,"x":50,"y":94,"w":82,"opacity":1,"bg":"#FFFFFF","border":"#E3E5E7","radius":12,"fontColor":"#18191C","fontSize":18,"lineHeight":1.75,"padding":22},"speaker":{"show":true,"offsetX":0,"offsetY":0,"scale":1,"bg":"#FB7299","color":"#FFFFFF","radius":999,"fontSize":14},"choices":{"show":true,"x":50,"y":36,"w":60,"opacity":1,"bg":"#FFFFFF","border":"#FB7299","color":"#FB7299","radius":12,"fontSize":16,"gap":11},"hint":{"show":true}}};
(()=>{let sc=null,di=0,flags={},muted=false,ctx=null,lang='',readScenes=new Set(),unlockedEndings=[];const $=s=>document.querySelector(s);const tr=s=>(PROJECT.locales&&PROJECT.locales[lang]&&PROJECT.locales[lang].strings&&PROJECT.locales[lang].strings[s])||s;const scene=id=>PROJECT.scenes.find(x=>x.id===id);const dlg=()=>{const d=sc&&sc.dialogues&&sc.dialogues.length?sc.dialogues:[{speaker:sc?.speaker||'',text:sc?.text||''}];return d.filter(x=>x.text||x.speaker);};function tone(f=600){if(muted)return;try{ctx=ctx||new(window.AudioContext||window.webkitAudioContext)();const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=f;g.gain.value=.06;g.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.12);o.connect(g);g.connect(ctx.destination);o.start();o.stop(ctx.currentTime+.13)}catch(e){}}const COND_FNS={chance(p){p=Number(p)||0;return Math.random()*100<Math.min(100,Math.max(0,p));},hourBetween(a,b){const h=new Date().getHours();a=Number(a)||0;b=Number(b)||0;return a<=b?(h>=a&&h<=b):(h>=a||h<=b);},hourNow(){return new Date().getHours();},minuteNow(){return new Date().getMinutes();},sceneRead(id){return !!(id&&readScenes.has(String(id)));},sceneCount(){return Array.isArray(PROJECT.scenes)?PROJECT.scenes.length:0;},endings(){return unlockedEndings.length;},endingSeen(kind,title){const k=String(kind||'');return title!==undefined?unlockedEndings.indexOf(k+'|'+title)>=0:unlockedEndings.some(x=>String(x).split('|')[0]===k);},abs(n){return Math.abs(Number(n)||0);}};class ExprParser{constructor(src){this.src=String(src||'');this.pos=0;this.len=this.src.length;this.flags={};}parse(){this.ws();const v=this.or();this.ws();if(this.pos<this.len)throw new Error('无法解析条件');return v;}ws(){while(this.pos<this.len&&/\s/.test(this.src[this.pos]))this.pos++;}or(){let l=this.and();while(true){this.ws();if(this.src.startsWith('||',this.pos)){this.pos+=2;const r=this.and();l=l||r;}else break;}return l;}and(){let l=this.eq();while(true){this.ws();if(this.src.startsWith('&&',this.pos)){this.pos+=2;const r=this.eq();l=l&&r;}else break;}return l;}eq(){let l=this.rel();while(true){this.ws();if(this.src.startsWith('==',this.pos)){this.pos+=2;l=l==this.rel();}else if(this.src.startsWith('!=',this.pos)){this.pos+=2;l=l!=this.rel();}else break;}return l;}rel(){let l=this.add();while(true){this.ws();if(this.src.startsWith('>=',this.pos)){this.pos+=2;l=l>=this.add();}else if(this.src.startsWith('<=',this.pos)){this.pos+=2;l=l<=this.add();}else if(this.src.startsWith('>',this.pos)){this.pos++;l=l>this.add();}else if(this.src.startsWith('<',this.pos)){this.pos++;l=l<this.add();}else break;}return l;}add(){let l=this.mul();while(true){this.ws();const c=this.src[this.pos];if(c==='+'){this.pos++;l=l+this.mul();}else if(c==='-'){this.pos++;l=l-this.mul();}else break;}return l;}mul(){let l=this.unary();while(true){this.ws();const c=this.src[this.pos];if(c==='*'){this.pos++;l=l*this.unary();}else if(c==='/'||c==='%'){this.pos++;const r=this.unary();l=c==='/'?l/r:l%r;}else break;}return l;}unary(){this.ws();const c=this.src[this.pos];if(c==='!'){this.pos++;return !this.unary();}if(c==='-'){this.pos++;return-this.unary();}return this.primary();}primary(){this.ws();const c=this.src[this.pos];if(c==='('){this.pos++;const v=this.or();this.ws();if(this.src[this.pos]!==')')throw new Error('缺少右括号');this.pos++;return v;}if(c==='"'||c==="'"){const q=c;this.pos++;let s='';while(this.pos<this.len&&this.src[this.pos]!==q)s+=this.src[this.pos++];if(this.src[this.pos]!==q)throw new Error('字符串未闭合');this.pos++;return s;}const num=this.src.slice(this.pos).match(/^(d+(.d+)?|.d+)/);if(num){this.pos+=num[0].length;return parseFloat(num[0]);}const id=this.src.slice(this.pos).match(/^[一-龥A-Za-z_][一-龥A-Za-z0-9_]*/);if(id){this.pos+=id[0].length;const n=id[0];if(n==='true')return true;if(n==='false')return false;this.ws();if(this.src[this.pos]==='('){this.pos++;const args=[];this.ws();if(this.src[this.pos]===')')this.pos++;else while(true){args.push(this.or());this.ws();if(this.src[this.pos]===','){this.pos++;continue;}if(this.src[this.pos]===')'){this.pos++;break;}throw new Error('函数参数错误');}const fn=COND_FNS[n];if(typeof fn!=='function')throw new Error('未知条件函数');return fn(...args);}return n in this.flags?Number(this.flags[n]):0;}throw new Error('无法解析条件');}}function cond(x){if(!x)return true;try{const p=new ExprParser(x);p.flags=flags;return!!p.parse();}catch(e){return false}}function setFlags(a){(a||[]).forEach(r=>{const v=Number(r.value)||0,old=Number(flags[r.flag]||0);flags[r.flag]=r.op==='+'?old+v:r.op==='-'?old-v:r.op==='*'?old*v:r.op==='/'?(v?old/v:old):v})}function bg(){const a=$('#app');a.style.backgroundColor=sc.bg||'#222';a.style.backgroundImage=sc.bgImage?'url("'+String(sc.bgImage).replace(/"/g,'\"')+'")':'none'}function applyUI(){const u=PROJECT.ui||{},g=u.global||{},t=u.textbox||{},c=u.choices||{};const app=$('#app'),panel=document.querySelector('.panel'),text=$('#text'),box=$('#choices');app.style.fontFamily=g.fontFamily||'system-ui';if(panel){panel.style.padding=(t.padding||22)+'px';panel.style.transition='all '+(g.transitionMs||0)+'ms ease'}if(text)text.style.lineHeight=t.lineHeight||1.75;if(box){box.style.gap=(c.gap||11)+'px';box.style.transition='all '+(g.transitionMs||0)+'ms ease'}}function cast(d){const box=$('#cast');box.innerHTML='';const ch=d&&d.charId?sc.characters.find(x=>x.id===d.charId):null;const lib=ch&&ch.charId?PROJECT.characters.find(x=>x.id===ch.charId):null;if(!ch||!lib)return;const ex=lib.expressions&&lib.expressions.find(x=>x.id===d.expressionId);const act=lib.actions&&lib.actions.find(x=>x.id===d.actionId);const src=ex&&ex.image?ex.image:(act&&act.image?act.image:lib.baseImage);if(src){const im=document.createElement('img');im.src=src;im.alt=tr(lib.name||'');const g=PROJECT.ui&&PROJECT.ui.global||{},ct=g.charTransition||'none',tm=g.transitionMs||0;if(ct!=='none'&&tm>0)im.style.animation='cast-'+ct+' '+tm+'ms ease both';box.appendChild(im)}}function show(){if(!sc)return;bg();$('#choices').classList.add('hidden');const ds=dlg();if(di<ds.length){const d=ds[di];cast(d);$('#speaker').textContent=tr(d.speaker||'');$('#speaker').classList.toggle('hidden',!d.speaker);$('#text').textContent=tr(String(d.text||'')).replace(/\{([^}]+)\}/g,(m,k)=>k.trim() in flags?flags[k.trim()]:m);return}if(sc.ending){const endingKey=String(sc.ending.kind||'')+'|'+String(sc.ending.title||'');if(unlockedEndings.indexOf(endingKey)<0)unlockedEndings.push(endingKey);$('#endKind').textContent=sc.ending.kind||'结局';$('#endTitle').textContent=tr(sc.ending.title||'END');$('#end').classList.remove('hidden');tone(880);return}const choices=(sc.choices||[]).filter(c=>cond(c.cond));if(choices.length){const box=$('#choices');box.innerHTML='';choices.forEach(c=>{const b=document.createElement('button');b.textContent=tr(c.text);b.onclick=()=>{tone(760);setFlags(c.setFlags);go(c.target)};box.appendChild(b)});box.classList.remove('hidden');return}let t=(sc.autoBranches||[]).find(x=>cond(x.cond))?.target||sc.next;if(t)go(t);else $('#text').textContent='剧情到此为止。'}function go(id){sc=scene(id);di=0;if(!sc){$('#text').textContent='缺少场景：'+id;return}readScenes.add(String(id));setFlags(sc.setFlags);show()}function start(){flags=JSON.parse(JSON.stringify(PROJECT.flags||{}));readScenes=new Set();unlockedEndings=[];applyUI();$('#title').classList.add('hidden');$('#end').classList.add('hidden');go(PROJECT.startScene)}$('#titleName').textContent=tr(PROJECT.title||'未命名作品');const ls=$('#lang');ls.innerHTML='<option value="">原文</option>'+Object.entries(PROJECT.locales||{}).map(([k,v])=>'<option value="'+k+'">'+(v.name||k)+'</option>').join('');ls.onchange=()=>{lang=ls.value;$('#titleName').textContent=tr(PROJECT.title||'未命名作品');if(sc)show()};$('#start').onclick=start;$('#again').onclick=start;$('#endBack').onclick=()=>{$('#end').classList.add('hidden');$('#title').classList.remove('hidden')};$('#back').onclick=()=>{location.reload()};$('#mute').onclick=()=>{muted=!muted;$('#mute').textContent=muted?'🔇 音效':'🔊 音效'};$('#app').onclick=e=>{if(e.target.closest('button')||e.target.closest('#choices'))return;if(sc&&di<dlg().length){di++;tone(620);show()}}})();</script></body></html>
